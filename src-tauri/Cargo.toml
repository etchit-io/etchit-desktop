[package]
name = "etchit-desktop"
version = "0.2.2"
description = "etchit desktop client"
authors = ["etchit-io"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "etchit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"
# Path dep into the Android repo's vendored Autonomi FFI crate. Cross-repo
# path is fragile but matches dev layout (~/Desktop/etchit-android-v3/ next
# to ~/Desktop/etchit-desktop/). Replace with a git dep once ant-sdk is
# extracted to its own repo.
ant-ffi = { path = "../../etchit-android-v3/ant-sdk/ffi/rust/ant-ffi" }

