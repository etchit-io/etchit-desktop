<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>etchit — etch it once, fetch it forever</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <h1 class="brand">etch<span class="brand-mark">/</span>it</h1>
      <p class="sub">
        <em>Etch it once.</em> Fetch it forever.
      </p>

      <div class="top-row">
        <div id="network" class="net-bar">Network: <span id="netStatus">starting…</span></div>
        <div id="walletBar" class="wallet-bar">
          <span id="walletStatus">Wallet: not connected</span>
          <button id="walletBtn" class="outlined">Connect</button>
        </div>
      </div>

      <div id="walletPrompt" class="wallet-prompt" hidden>
        <span class="wallet-prompt-icon">📱</span>
        <span>Check your phone — <span id="walletPromptLabel">…</span></span>
      </div>

      <section class="etch-panel">
        <h2>Create an etch <span class="info" data-tip="Wallet must be connected. Public etches: anyone with the address can fetch. Private etches: data-map stays on this device, encrypted with your wallet key.">i</span></h2>
        <label for="etchTitle">Title (optional)</label>
        <input id="etchTitle" type="text" placeholder="e.g. release notes" autocomplete="off" />
        <label for="etchText">Content</label>
        <textarea id="etchText" rows="6" placeholder="Paste text here. Multi-line is fine."></textarea>
        <label class="checkbox">
          <input id="etchPrivate" type="checkbox" />
          <span>Private (data-map stored locally, not on the network)</span>
        </label>
        <div class="controls">
          <button id="etchBtn">Etch</button>
          <span id="etchStatus" class="status"></span>
        </div>
        <div id="etchResult"></div>
      </section>

      <h2 class="section-title">Private etches</h2>
      <p class="sub" style="margin-bottom: 12px;">
        Stored on this device only. Encrypted at rest with a wallet-derived key.
      </p>
      <div id="privateList" class="results"></div>

      <h2 class="section-title">Library <span class="info" data-tip="Pulls your encrypted library entries from Arbitrum and decrypts them locally. Uses your wallet to sign a derive-key message (same as the mobile app), no copy-paste of the library key needed.">i</span></h2>

      <div class="controls" style="margin-top: 8px; margin-bottom: 8px;">
        <button id="connect">Open library</button>
        <span id="connectStatus" class="status"></span>
      </div>

      <details id="manualSection">
        <summary>Or enter key manually</summary>
        <label for="wallet">Wallet address</label>
        <input id="wallet" type="text" placeholder="0x… (40 hex chars)" autocomplete="off" spellcheck="false" />

        <label for="key">Library key (Settings → Library → Back up library key)</label>
        <div style="display: flex; gap: 8px;">
          <input id="key" type="password" placeholder="64 hex chars" autocomplete="new-password" spellcheck="false" style="flex: 1;" />
          <button id="toggleKey" type="button" class="outlined" style="padding: 0 10px;">Show</button>
        </div>
        <div class="controls" style="margin-top: 12px;">
          <button id="decodeManual">Decode library</button>
        </div>
      </details>

      <details>
        <summary>Advanced</summary>
        <label for="indexer">Indexer base URL</label>
        <input id="indexer" type="text" value="https://arbitrum.blockscout.com/api" autocomplete="off" spellcheck="false" />
      </details>

      <div class="controls" style="margin-top: 18px;">
        <span id="status" class="status"></span>
      </div>

      <div class="results" id="results"></div>

    </main>
  </body>
</html>
