[package]
name = "etchit-desktop"
version = "0.2.7"
description = "Desktop publisher for the Autonomi network. Companion to fetch>it desktop."
authors = ["the etch/it contributors"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "etchit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
# Clipboard read/write — used by the "etch this image" toast that
# fires when the user copies an image (or takes a screenshot that
# lands in the clipboard). Opt-in; gated by a Settings toggle.
tauri-plugin-clipboard-manager = "2"
# OS-native notifications — pings the user that a fresh clipboard
# image is waiting to be etched even when etch/it isn't focused.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
# etchit's own upload crate — same one Android binds to via UniFFI.
# Pulled as a regular Rust dep so we call it Rust→Rust and skip the FFI layer.
ant-ffi = { path = "../../../ffi/rust/ant-ffi" }
# OS-native secret storage (macOS Keychain / Windows Credential Manager /
# Linux Secret Service over DBus). Wallet keys live here, never on disk.
# `keyring` ships zero default features — without these flags the crate
# falls back to a no-op mock backend that quietly drops every write.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native-sync-persistent",
    "crypto-rust",
] }
# Fingerprint the wallet key so we can invalidate the cached Client
# without keeping the key in two places.
sha2 = "0.10"
# Bundle multi-file Etch / Private Etch uploads into one ZIP so they
# cost one upload and one wallet payment. `Stored` mode (no
# compression) keeps each inner file byte-identical to its original.
zip = { version = "2", default-features = false }
# Used only by peers::refresh_from_upstream to GET WithAutonomi's
# canonical bootstrap_peers.toml. rustls-tls keeps us off the system
# OpenSSL dep tree on Linux.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Parse the upstream bootstrap_peers.toml. Small dep, robust against
# WithAutonomi's exact TOML shape (peers = […], or [[peer]] tables).
toml = "0.8"

# The earlier ant-node 0.11.1 → 0.11.3 bump rebuilt against current
# saorsa, so the source-incompatibility workaround that pinned
# saorsa-core = 0.24.2 / saorsa-transport = 0.34.1 is no longer
# required. Cargo now resolves to the version ant-core 0.2.4 wants.

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
