[package]
name = "etchit-desktop"
version = "0.1.0"
description = "Desktop publisher for the Autonomi network. Companion to fetch>it desktop."
authors = ["the etch/it contributors"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "etchit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
# etchit's own upload crate — same one Android binds to via UniFFI.
# Pulled as a regular Rust dep so we call it Rust→Rust and skip the FFI layer.
ant-ffi = { path = "../../../ffi/rust/ant-ffi" }
# OS-native secret storage (macOS Keychain / Windows Credential Manager /
# Linux Secret Service over DBus). Wallet keys live here, never on disk.
# `keyring` ships zero default features — without these flags the crate
# falls back to a no-op mock backend that quietly drops every write.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native-sync-persistent",
    "crypto-rust",
] }
# Fingerprint the wallet key so we can invalidate the cached Client
# without keeping the key in two places.
sha2 = "0.10"
# Bundle multi-file Etch / Private Etch uploads into one ZIP so they
# cost one upload and one wallet payment. `Stored` mode (no
# compression) keeps each inner file byte-identical to its original.
zip = { version = "2", default-features = false }
# Chainmark v1 (docs/chainmark-format-v1.md): EIP-191 personal_sign for
# internal-mode wallets. WalletConnect mode uses AppKit's provider in
# JS, so this is only the internal half. `k256` + `sha3` are already
# in the dep graph transitively via alloy — direct deps keep the
# version surface explicit.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["std"] }

# Transitive pins — `ant-node = 0.11.1` (pulled in via `ant-ffi`) is
# source-incompatible with `saorsa-core >= 0.24.3` (added a
# `transport_source` field to `P2PEvent::Message` that breaks
# ant-node's pattern match) and `saorsa-transport >= 0.34.2`. The
# `ffi/rust/Cargo.lock` locks these to the working pair; we mirror
# that here so etchit-desktop's resolver doesn't pick newer patch
# versions on a fresh build. Drop these whenever the FFI bumps
# ant-node to a release built against current saorsa.
saorsa-core = "=0.24.2"
saorsa-transport = "=0.34.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
