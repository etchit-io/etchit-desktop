name: desktop release

# Triggers:
#   * workflow_dispatch — manual test runs from the Actions tab. Builds
#     all three platforms and uploads the resulting bundles as
#     workflow artifacts so the operator can download + smoke-test
#     without cutting a real release.
#   * push of a `v*` tag — same build, but additionally attaches the
#     bundles to a draft GitHub Release named after the tag. The
#     Android `release.yml` fires on the same trigger and posts the
#     APK to the same draft release; publish the draft from the UI
#     once everything's been verified.
#
# Repo secrets used: none required for the unsigned build. Code-signing
# certs (Apple Developer ID, Microsoft Authenticode) are out of scope
# for V1 — testers know us. When we add signing, plug the certs in via
# the env block on the tauri-action step.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            # Skip .rpm — needs rpmbuild which isn't on the runner by
            # default and we don't ship a Fedora user yet.
            args: '--bundles deb,appimage'
          - platform: macos-latest
            args: '--bundles dmg'
          - platform: windows-latest
            args: '--bundles msi'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Match the toolchain that `ffi/rust/rust-toolchain.toml` pins
      # for the FFI crate — keeps Cargo's resolver consistent across
      # the workspace.
      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/etchit-desktop/src-tauri

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev

      - name: Install frontend deps
        working-directory: apps/etchit-desktop
        run: npm ci

      # tauri-action does the npm run build → cargo tauri build →
      # bundle dance, and (when tagName is non-empty) attaches the
      # resulting bundles to a draft GitHub Release. For
      # workflow_dispatch runs tagName is empty and the action just
      # builds; the upload step below collects the bundles as
      # workflow artifacts so the operator can download them.
      - name: Build
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./apps/etchit-desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etchit-desktop-${{ runner.os }}
          path: |
            apps/etchit-desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/etchit-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/etchit-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/etchit-desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
