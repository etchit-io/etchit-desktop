name: Mobile release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Need write access to attach the signed APK to the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Restore the release keystore from a base64-encoded secret.
      # The same KEYSTORE_PASSWORD secret unlocks both the keystore
      # and the etchit alias key (keyPassword == storePassword in
      # app/build.gradle.kts).
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set on this repo"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Keystore restored ($(wc -c < release.keystore) bytes)"

      # build.gradle.kts reads KEYSTORE_PASSWORD and REOWN_PROJECT_ID
      # from local.properties (which is gitignored). Recreate it from
      # secrets at build time. Don't echo values — GitHub Actions
      # auto-redacts but better not to risk it.
      - name: Create local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          {
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "REOWN_PROJECT_ID=${REOWN_PROJECT_ID}"
          } > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      # Tag drives the file name so a downloader can tell builds apart.
      - name: Stage APK with versioned name
        run: |
          mkdir -p staged
          cp app/build/outputs/apk/release/app-release.apk \
             "staged/etchit-${GITHUB_REF_NAME}.apk"
          ls -la staged/

      # Attach to a draft release. Manual smoke test on the device, then
      # publish from the GitHub UI. Avoids unverified builds landing on
      # /releases/latest before anyone's run them.
      - name: Attach APK to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: staged/etchit-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Always wipe the restored secrets, in case anything later in the
      # workflow tries to read or upload them. Belt-and-braces — the
      # runner is ephemeral but explicit cleanup costs nothing.
      - name: Cleanup secrets
        if: always()
        run: |
          rm -f release.keystore local.properties
